name: Backend CI

on:
  push:
    branches: [main, 001-spending-targets-mvp]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, 001-spending-targets-mvp]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mybudget_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mybudget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mybudget_test:testpassword@localhost:5432/mybudget_test
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt', 'backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        working-directory: backend
        run: |
          ruff check src tests

      - name: Run type checking
        working-directory: backend
        run: |
          mypy src --ignore-missing-imports

      - name: Run migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest --cov=src/mybudget --cov-report=xml --cov-report=html --cov-fail-under=70

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
